<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151922">
  <meta name="description" content="藍星科技授權碼產生工具">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://*.trycloudflare.com; base-uri 'self'; form-action 'self'">
  <title>藍星科技開通網</title>
  <link rel="icon" href="assets/bluestar-logo.png">
  <link rel="stylesheet" href="styles.css?v=20260807-1">
</head>
<body>
  <main>
    <form id="generator-form" class="generator-form" novalidate>
      <fieldset>
        <legend>選擇使用期限</legend>
        <div class="duration-options">
          <label><input type="radio" name="access-days" value="15"><span>15 天</span></label>
          <label><input type="radio" name="access-days" value="30" checked><span>30 天</span></label>
          <label><input type="radio" name="access-days" value="90"><span>90 天</span></label>
          <label><input type="radio" name="access-days" value="365"><span>365 天</span></label>
          <label><input type="radio" name="access-days" value="custom"><span>自訂期限</span></label>
        </div>
      </fieldset>
      <small class="field-help">授權碼永久有效，第一次成功使用後立即失效；同一 LINE 帳號自成功開通日起 30 天內只能開通一次。</small>

      <label class="field" for="custom-days">
        <span>自訂天數</span>
        <input id="custom-days" type="number" inputmode="numeric" min="1" max="3650" placeholder="例如 45" disabled>
      </label>

      <label class="field" for="customer-label">
        <span>客戶備註（選填）</span>
        <input id="customer-label" type="text" maxlength="80" autocomplete="off" placeholder="例如：王小姐－進階方案">
      </label>

      <fieldset class="feature-access">
        <legend>功能權限</legend>
        <div class="feature-options">
          <label class="feature-option">
            <span><strong>WBS 網站製作</strong><small>建立、修改及部署網站</small></span>
            <input id="feature-wbs" type="checkbox">
          </label>
          <label class="feature-option">
            <span><strong>GitHub 部署</strong><small>儲存庫與公開網頁部署</small></span>
            <input id="feature-github" type="checkbox">
          </label>
          <label class="feature-option">
            <span><strong>SD 影片</strong><small>每秒 9 積分，最長 15 秒</small></span>
            <input id="feature-sd-video" type="checkbox">
          </label>
        </div>
      </fieldset>

      <label class="field" for="sd-credits">
        <span>SD 儲值金額／積分</span>
        <input id="sd-credits" type="number" inputmode="numeric" min="36" max="100000" step="1" value="0" disabled>
        <small id="sd-credit-preview" class="field-help">1 元 = 1 積分；單次最低儲值 36 元。</small>
      </label>

      <label class="field" for="admin-key">
        <span>管理密碼</span>
        <input type="text" name="username" autocomplete="username" value="藍星科技管理員" hidden>
        <input id="admin-key" name="password" type="password" autocomplete="current-password" placeholder="輸入藍星科技管理密碼" required>
      </label>

      <div class="credential-actions">
        <label class="remember-option">
          <input id="remember-admin-key" type="checkbox" checked>
          <span>記住管理密碼</span>
        </label>
        <button id="forget-admin-key" class="icon-button" type="button" title="清除已記住的管理密碼" aria-label="清除已記住的管理密碼" hidden>
          <i data-lucide="trash-2" aria-hidden="true"></i>
        </button>
      </div>

      <button class="primary-button" type="submit">
        <i data-lucide="key-round" aria-hidden="true"></i>
        產生授權碼
      </button>

      <div id="generator-status" class="status-message" role="status" aria-live="polite"></div>

      <div id="generated-code" class="generated-code" hidden>
        <span>新授權碼</span>
        <strong></strong>
        <small></small>
        <button id="copy-generated-code" class="secondary-button" type="button">
          <i data-lucide="copy" aria-hidden="true"></i>
          複製授權碼
        </button>
      </div>
    </form>
    <section class="status-panel" aria-labelledby="status-panel-title">
      <div class="status-panel-heading">
        <div>
          <h2 id="status-panel-title">開通狀態查詢</h2>
          <p>查看授權碼是否已使用，以及已綁定的 LINE 帳號。</p>
        </div>
        <button id="refresh-pairing-status" class="secondary-button status-refresh" type="button">
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
          查詢
        </button>
      </div>
      <div id="pairing-status-message" class="status-message" role="status" aria-live="polite"></div>
      <form id="sd-topup-form" class="sd-topup-form" novalidate hidden>
        <div class="sd-topup-heading">
          <div>
            <h3>已開通帳號 SD 加值</h3>
            <p>直接增加積分並啟用 SD 影片，原本的使用期限與其他功能不變。</p>
          </div>
          <span class="sd-topup-badge">1 元 = 1 積分</span>
        </div>
        <div class="sd-topup-grid">
          <label class="topup-field topup-account" for="sd-topup-account">
            <span>LINE 帳號</span>
            <select id="sd-topup-account" required></select>
          </label>
          <label class="topup-field" for="sd-topup-credits">
            <span>加值積分</span>
            <input id="sd-topup-credits" type="number" inputmode="numeric" min="36" max="100000" step="1" value="45" required>
          </label>
          <label class="topup-field" for="sd-topup-note">
            <span>加值備註（選填）</span>
            <input id="sd-topup-note" type="text" maxlength="80" autocomplete="off" placeholder="例如：8 月 SD 加值">
          </label>
        </div>
        <small id="sd-topup-preview" class="field-help">本次增加 45 積分，可製作 5 秒影片。</small>
        <button id="sd-topup-submit" class="primary-button sd-topup-submit" type="submit">
          <i data-lucide="badge-plus" aria-hidden="true"></i>
          加值 SD 積分
        </button>
        <div id="sd-topup-status" class="status-message" role="status" aria-live="polite"></div>
      </form>
      <section id="image-quota-reset-form" class="image-quota-reset-form" aria-labelledby="image-quota-title">
        <div class="sd-topup-heading">
          <div>
            <h3 id="image-quota-title">今日做圖額度管理</h3>
            <p>只重置今天的 IMAGE2 做圖額度，不影響歷史成品、SD 積分或使用期限。</p>
          </div>
          <span class="sd-topup-badge">每日額度</span>
        </div>
        <div class="image-quota-grid">
          <label class="topup-field" for="image-quota-account">
            <span>指定 LINE 帳號</span>
            <select id="image-quota-account" disabled>
              <option value="">請先查詢開通狀態</option>
            </select>
          </label>
          <button id="reset-user-image-quota" class="quota-reset-button" type="button" disabled>
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
            重置此用戶
          </button>
          <button id="reset-all-image-quota" class="danger-button" type="button">
            <i data-lucide="users" aria-hidden="true"></i>
            重置今天全部用戶
          </button>
        </div>
        <div id="image-quota-status" class="status-message" role="status" aria-live="polite"></div>
      </section>
      <div id="pairing-status-content" class="status-content" hidden></div>
    </section>
  </main>

  <script src="assets/lucide.min.js?v=0.468.0" defer></script>
  <script src="app.js?v=20260807-1" defer></script>
</body>
</html>
