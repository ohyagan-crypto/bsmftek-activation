<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151922">
  <meta name="description" content="BSMFTEK 授權碼產生工具">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://unpkg.com; connect-src 'self' https://*.trycloudflare.com; base-uri 'self'; form-action 'self'">
  <title>BSMFTEK 開通網</title>
  <link rel="icon" href="assets/bluestar-logo.png">
  <link rel="stylesheet" href="styles.css?v=20260726-2">
</head>
<body>
  <main>
    <form id="generator-form" class="generator-form" novalidate>
      <fieldset>
        <legend>選擇使用期限</legend>
        <div class="duration-options">
          <label><input type="radio" name="access-days" value="15" checked><span>15 天</span></label>
          <label><input type="radio" name="access-days" value="30"><span>30 天</span></label>
          <label><input type="radio" name="access-days" value="90"><span>90 天</span></label>
          <label><input type="radio" name="access-days" value="365"><span>365 天</span></label>
          <label><input type="radio" name="access-days" value="custom"><span>自訂期限</span></label>
        </div>
      </fieldset>

      <label class="field" for="custom-days">
        <span>自訂天數</span>
        <input id="custom-days" type="number" inputmode="numeric" min="1" max="3650" placeholder="例如 45" disabled>
      </label>

      <label class="field" for="customer-label">
        <span>客戶備註</span>
        <input id="customer-label" type="text" maxlength="80" autocomplete="off" placeholder="例如：王小姐－進階方案" required>
      </label>

      <label class="field" for="admin-key">
        <span>管理密碼</span>
        <input id="admin-key" type="password" autocomplete="current-password" placeholder="輸入 BSMF 管理密碼" required>
      </label>

      <button class="primary-button" type="submit">
        <i data-lucide="key-round" aria-hidden="true"></i>
        產生授權碼
      </button>

      <div id="generator-status" class="status-message" role="status" aria-live="polite"></div>

      <div id="generated-code" class="generated-code" hidden>
        <span>新授權碼</span>
        <strong></strong>
        <small></small>
        <button id="copy-generated-code" class="secondary-button" type="button">
          <i data-lucide="copy" aria-hidden="true"></i>
          複製授權碼
        </button>
      </div>
    </form>
  </main>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="app.js?v=20260726-2" defer></script>
</body>
</html>
